name: Build Android

on:
  workflow_call:
    inputs:
      variant:
        type: string
        default: debug
      ref:
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  pull_request:
    paths:
      - 'apps/android/**'
      - 'package.json'
      - 'src/assets/**'
      - 'src/shared/**'
      - 'src/utils/songLink.js'
      - 'src/utils/listenTogether.js'
      - 'src/utils/theme.js'
      - 'scripts/patch-ncm-api.cjs'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: Android build type
        type: choice
        options: [debug, release]
        default: debug
      ref:
        description: Source branch or tag. Defaults to the selected ref.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.ref || github.ref }}-${{ inputs.variant || 'debug' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_VARIANT: ${{ inputs.variant || 'debug' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/android/package-lock.json
            apps/android/mobile-runtime/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      # Existing tags may resolve shared imports from the root package.
      - name: Install root production dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Install Android dependencies
        run: npm run android:install
      - name: Resolve version
        id: version
        env:
          SOURCE_REF: ${{ inputs.ref || github.ref }}
        shell: bash
        run: |
          case "$BUILD_VARIANT" in debug|release) ;; *) echo "Invalid variant: $BUILD_VARIANT"; exit 1 ;; esac
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [[ "$SOURCE_REF" == refs/tags/* && "${SOURCE_REF#refs/tags/}" != "$tag" ]]; then
            echo "Tag must match the root package.json: $tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure release signing
        if: env.BUILD_VARIANT == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing signing secret: $name"; exit 1; fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hydrogen-android.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hydrogen-android.keystore" >> "$GITHUB_ENV"
      - name: Build debug APK
        if: env.BUILD_VARIANT == 'debug'
        run: npm run android:build
      - name: Build signed APK and AAB
        if: env.BUILD_VARIANT == 'release'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run android:release
          npm run android:bundle
      - name: Verify signed APK and AAB
        if: env.BUILD_VARIANT == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          apk="apps/android/release/$VERSION/Hydrogen.Music-Android-$VERSION-release.apk"
          aab="apps/android/release/$VERSION/Hydrogen.Music-Android-$VERSION-release.aab"
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/hydrogen-android.cer"
          expected="$(sha256sum "$RUNNER_TEMP/hydrogen-android.cer" | cut -d ' ' -f 1)"
          signature="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signature"
          actual="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [[ "$actual" != "$expected" ]]; then echo 'APK signing certificate does not match the release key'; exit 1; fi
          jarsigner -verify -strict -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD "$aab" "$ANDROID_KEY_ALIAS"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n '1p'
      - uses: actions/upload-artifact@v7
        if: env.BUILD_VARIANT == 'debug'
        with:
          name: hydrogen-music-android-debug
          path: apps/android/release/**
          if-no-files-found: error
          retention-days: 14
      - name: Collect Android release assets
        if: env.BUILD_VARIANT == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p _release-assets
          cp "apps/android/release/$VERSION/Hydrogen.Music-Android-$VERSION-release.apk" _release-assets/
          cp "apps/android/release/$VERSION/Hydrogen.Music-Android-$VERSION-release.aab" _release-assets/
      - uses: actions/upload-artifact@v7
        if: env.BUILD_VARIANT == 'release'
        with:
          name: release-package-Android
          path: _release-assets/**
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hydrogen-android.keystore" "$RUNNER_TEMP/hydrogen-android.cer"
