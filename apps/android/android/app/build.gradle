apply plugin: 'com.android.application'

// All platforms share the product version; Android keeps a monotonic upgrade code.
def appPackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def productPackage = new groovy.json.JsonSlurper().parse(file('../../../../package.json'))
def brandingResources = layout.buildDirectory.dir('generated/branding/res')
def syncLauncherIcon = tasks.register('syncLauncherIcon', Copy) {
    from('../../../../src/assets/icon/icon.png')
    into(brandingResources.map { it.dir('drawable-nodpi') })
    rename { 'hydrogen_music_icon.png' }
}
def signingVariables = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def signingReady = signingVariables.every { System.getenv(it) }

android {
    namespace = 'com.hydrogen.music'
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.hydrogen.music'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appPackage.androidVersionCode as int
        versionName productPackage.version
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets.main.res.srcDir(brandingResources)
    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.named('preBuild').configure { dependsOn(syncLauncherIcon) }

// Also enforce signing when Gradle is invoked directly or from Android Studio.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name ==~ /(?i).*(assemble|bundle|package).*release.*/ } && !signingReady) {
        throw new GradleException('Release signing requires ' + signingVariables.join(', '))
    }
}

repositories {
    flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
